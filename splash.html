<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #0f0f0f; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
            font-family: sans-serif; border: 1px solid #333; box-sizing: border-box;
        }
        .logo { width: 120px; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); animation: pulse 2s infinite; }
        .loader {
            margin-top: 20px; width: 40px; height: 40px;
            border: 4px solid #333; border-top: 4px solid #FFA500;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        .text { margin-top: 15px; color: #666; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <img src="logo.png" class="logo">
    <div class="loader"></div>
    <div class="text">Iniciando...</div>
</body>
</html>
