[package]
name = "app"
version = "1.2.14"
description = "Launcher Oficial de Migajas Studio"
authors = ["Migajas Studio"]
license = "MIT"
repository = "https://github.com/Dexi-lov/migajas-launcher"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "blocking", "multipart"] }
mc-launcher-core = "0.1.2"
reqwest-retry = "0.6"
reqwest-middleware = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v3", "v4"] }
regex = "1"
futures-util = "0.3"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
keyring = "2"
open = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

# ─── Resourcepacks (lectura de ZIP) ─────────────────────────────────────
zip = { version = "2", default-features = false, features = ["deflate"] }

# ─── Vault de mods (cifrado + shred) ─────────────────────────────────────
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-updater = "2"
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"

# ─────────────────────────────────────────────────────────────────────────
# Perfil de release optimizado para tamaño del .exe
# ─────────────────────────────────────────────────────────────────────────
[profile.release]
panic = "abort"
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.release.package."*"]
opt-level = 3

