<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Migajas Launcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
    
    <style>
        /* --- ESTILOS GLOBALES --- */
        :root { --accent: #FFA500; --bg: #0f0f0f; --panel: #1a1a1a; --mc-green: #3c8527; --custom-blue: #2979FF; }
        * { box-sizing: border-box; user-select: none; outline: none; }
        
        body { 
            margin: 0; height: 100vh; font-family: 'Poppins', sans-serif; 
            background-color: var(--bg); color: white; overflow: hidden; 
            background-image: radial-gradient(circle at top right, #1a1a1a 0%, #000000 70%);
            padding: 0; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        /* PANTALLAS */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: var(--bg); z-index: 10; }
        .screen.active { display: flex !important; }
        
        /* LOGIN */
        #screen-login { justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); z-index: 200; }
        .login-box { width: 350px; text-align: center; padding: 40px; background: var(--panel); border-radius: 20px; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        /* MODE SELECT */
        #screen-mode { flex-direction: column; align-items: center; padding-top: 60px; background: radial-gradient(circle at top, #222 0%, #000 80%); z-index: 150; }
        .mode-title { font-size: 28px; font-weight: 900; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .mode-container { display: flex; gap: 25px; }
        
        .mode-card {
            width: 240px; height: 320px; background: var(--panel); border-radius: 15px;
            border: 2px solid #333; cursor: pointer; position: relative; overflow: hidden; 
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; 
            transition: all 0.3s;
        }
        .mode-card:hover { transform: translateY(-10px); }
        .mode-bg { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; opacity: 0.4; transition: 0.5s; z-index: 0; }
        .mode-card:hover .mode-bg { opacity: 0.8; transform: scale(1.1); }
        
        .card-event:hover { border-color: #FFA500; box-shadow: 0 0 20px rgba(255, 165, 0, 0.2); }
        .card-vanilla:hover { border-color: #3c8527; box-shadow: 0 0 20px rgba(60, 133, 39, 0.2); }
        .card-custom:hover { border-color: #2979FF; box-shadow: 0 0 20px rgba(41, 121, 255, 0.2); }

        .mode-label { position: relative; z-index: 2; font-size: 22px; font-weight: 800; text-shadow: 0 2px 10px black; }
        .mode-desc { position: relative; z-index: 2; font-size: 11px; color:#ddd; margin-top:5px; text-shadow: 0 1px 5px black;}

        /* DASHBOARD */
        #screen-dashboard { flex-direction: row; }
        
        .sidebar { 
            width: 80px; background: #111; display: flex; flex-direction: column; 
            align-items: center; padding-top: 30px; border-right: 1px solid #222; 
            z-index: 999; flex-shrink: 0; padding-bottom: 20px; position: relative;
        }
        .content-area { flex-grow: 1; display: flex; flex-direction: column; position: relative; padding: 30px; z-index: 1; }

        .logo-img { width: 50px; margin-bottom: 50px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
        .nav-btn { width: 50px; height: 50px; margin-bottom: 15px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #555; font-size: 22px; cursor: pointer; transition: 0.2s; position: relative; }
        .nav-btn.active { background: var(--accent); color: black; box-shadow: 0 0 15px var(--accent); }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        
        .nav-tooltip {
            position: absolute; left: 65px; top: 10px; background: #222; color: white; padding: 5px 12px; border: 1px solid #444;
            border-radius: 6px; font-size: 12px; font-weight: bold; opacity: 0; pointer-events: none; transition: 0.2s; 
            white-space: nowrap; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); transform: translateX(-10px);
        }
        .nav-btn:hover .nav-tooltip { opacity: 1; transform: translateX(0); }

        .user-mini { margin-top: auto; text-align: center; width: 100%; cursor: pointer; }
        #dash-head { width: 40px; height: 40px; border-radius: 10px; margin-bottom: 5px; border: 2px solid #333; background: #222; transition: 0.2s; }
        .user-mini:hover #dash-head { border-color: var(--accent); }

        .title-bar { position: absolute; top: 0; right: 0; width: 100%; height: 35px; display: flex; justify-content: flex-end; align-items: center; padding-right: 10px; -webkit-app-region: drag; z-index: 100; pointer-events: none; }
        .win-btn { -webkit-app-region: no-drag; margin-left: 15px; cursor: pointer; color: #666; pointer-events: auto; font-size: 16px; } .win-btn:hover { color: white; }

        .page-content { display: none; height: 100%; overflow-y: auto; padding-top: 10px; }
        .page-content.active { display: block; }

        /* PLAY AREA */
        .hero-section { width: 100%; height: 240px; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid #333; margin-bottom: 30px; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .media-bg { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.5s; }
        .hero-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px; background: linear-gradient(to top, #0f0f0f 20%, transparent); }
        #event-title { font-size: 42px; font-weight: 900; margin: 0; text-shadow: 0 5px 20px rgba(0,0,0,0.8); line-height: 1; }
        
        .bottom-bar { display: flex; align-items: center; gap: 20px; background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .version-selector { flex-grow: 1; display:flex; gap:10px; align-items:flex-end; }
        select { width: 100%; padding: 12px; background: #111; color: white; border: 1px solid #333; border-radius: 8px; font-family: 'Poppins'; font-weight: 600; cursor: pointer; }
        .action-btn { width: 50px; height: 50px; background: #181818; border: 1px solid #333; border-radius: 10px; color: #aaa; cursor: pointer; font-size: 18px; }
        .action-btn:hover { background: #252525; color: white; }

        #btn-main { width: 100%; padding: 15px; font-size: 18px; font-weight: 900; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; color: white; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #btn-main:hover { transform: scale(1.02); filter: brightness(1.1); }
        .btn-microsoft { background-color: #0078D7; color: white; }
        .btn-green { background-color: var(--mc-green); color: white; }
        .btn-accent { background-color: var(--accent); color: black !important; }
        .btn-blue { background-color: var(--custom-blue); }

        .progress-bar { height: 6px; background: #222; width: 100%; margin-top: 5px; border-radius: 3px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
        #status-text { text-align: center; font-size: 10px; color: #666; margin-top: 3px; font-family: monospace; }

        /* SKINS */
        .skin-container { display: flex; gap: 30px; align-items: flex-start; justify-content: center; height: 80%; }
        .skin-preview-box { width: 250px; height: 350px; background: #151515; border: 1px solid #333; border-radius: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #skin-canvas { cursor: move; }
        .skin-actions { display: flex; flex-direction: column; gap: 15px; width: 250px; }
        .model-selector { display: flex; gap: 10px; background: #111; padding: 5px; border-radius: 8px; }
        .model-opt { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 6px; font-size: 12px; color: #666; transition: 0.2s; border: 1px solid transparent; }
        .model-opt.selected { background: var(--accent); color: black; font-weight: bold; }
        
        /* BIBLIOTECA DE SKINS MEJORADA */
        #skin-library { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            max-height: 230px; overflow-y: auto; padding-right: 5px; 
            background: #111; padding: 10px; border-radius: 10px; border: 1px solid #333; 
        }
        .saved-skin { 
            width: 100%; aspect-ratio: 0.8; 
            background: linear-gradient(to bottom, #2a2a2a, #1a1a1a);
            border: 1px solid #444; border-radius: 8px; cursor: pointer; 
            transition: all 0.2s; position: relative; overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
        }
        .saved-skin img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .saved-skin:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .del-skin { 
            position: absolute; top: 5px; right: 5px; 
            background: rgba(255, 68, 68, 0.8); width: 20px; height: 20px; 
            border-radius: 4px; font-size: 10px; display: none; 
            align-items: center; justify-content: center; color: white; cursor: pointer; z-index: 5;
        }
        .saved-skin:hover .del-skin { display: flex; }

        /* MODAL & SETTINGS */
        .setting-group { background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 500; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { width: 400px; background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #444; text-align: left; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .create-btn { width: 100%; padding: 12px; background: var(--custom-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="create-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top:0;">Nueva Instancia</h2>
            <div style="margin-bottom:15px;"><span style="color:#888; font-size:12px;">Nombre</span><input type="text" id="new-name" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:white; border-radius:5px;" placeholder="Mi Survival"></div>
            <div style="margin-bottom:15px;"><span style="color:#888; font-size:12px;">Versión</span><select id="new-version" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:white; border-radius:5px;"><option>Cargando...</option></select></div>
            <div style="margin-bottom:15px;"><span style="color:#888; font-size:12px;">Loader</span><div style="display:flex; gap:10px;"><label><input type="radio" name="loader" value="vanilla" checked> Vanilla</label><label><input type="radio" name="loader" value="fabric"> Fabric</label></div></div>
            <button class="create-btn" onclick="createInstance()">CREAR</button>
            <button class="create-btn" style="background:#333; margin-top:5px;" onclick="document.getElementById('create-modal').style.display='none'">CANCELAR</button>
        </div>
    </div>

    <div id="screen-login" class="screen active">
        <div class="title-bar"><i class="fas fa-times win-btn" onclick="ipcRenderer.send('cerrar-app')"></i></div>
        <div class="login-box">
            <img src="logo.png" style="width:80px; margin-bottom:20px;">
            <h2>Bienvenido</h2>
            <button onclick="loginMicrosoft()" style="width:100%; padding:15px; background:#0078D7; border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom:10px;"><i class="fab fa-microsoft"></i> Entrar con Microsoft</button>
            <button onclick="toggleOffline()" style="width:100%; padding:15px; background:#333; border:1px solid #444; color:#aaa; border-radius:8px; cursor:pointer;">Modo Offline</button>
            <div id="offline-form" style="display:none; margin-top:15px;">
                <input type="text" id="nick-input" placeholder="Tu Nick" style="padding:10px; border-radius:5px; border:1px solid #444; background:#222; color:white; width:100%; text-align:center;">
                <button onclick="loginOffline()" style="margin-top:10px; padding:10px; width:100%; background:var(--accent); border:none; border-radius:5px; font-weight:bold; cursor:pointer;">ENTRAR</button>
            </div>
            <p id="login-status" style="font-size:12px; color:#666; margin-top:10px;"></p>
        </div>
    </div>

    <div id="screen-mode" class="screen" style="justify-content:center; align-items:center; gap:30px;">
        <div class="title-bar" style="top:0;"><i class="fas fa-sign-out-alt win-btn" onclick="logout()" title="Cerrar Sesión"></i></div>
        <h1 style="font-size:32px;">SELECCIONA MODO</h1>
        <div class="mode-container">
            <div class="mode-card card-event" onclick="selectMode('event')">
                <img src="evento.png" class="mode-bg" onerror="this.src='https://i.imgur.com/u5Fp9G7.jpeg'"> 
                <div class="mode-label">EVENTOS</div>
                <div class="mode-desc">Oficiales de Migajas.</div>
            </div>
            <div class="mode-card card-vanilla" onclick="selectMode('vanilla')">
                <img src="minecraft.jpg" class="mode-bg" onerror="this.style.backgroundColor='#3c8527'"> 
                <div class="mode-label">MINECRAFT</div>
                <div class="mode-desc">Vanilla Clásico.</div>
            </div>
            <div class="mode-card card-custom" onclick="selectMode('custom')">
                <img src="instancias.png" class="mode-bg" onerror="this.style.backgroundColor='#2979FF'">
                <div class="mode-label">MIS INSTANCIAS</div>
                <div class="mode-desc">Crea tus propios perfiles.</div>
            </div>
        </div>
    </div>

    <div id="screen-dashboard" class="screen">
        <div class="sidebar">
            <img src="logo.png" class="logo-img">
            <div class="nav-btn active" id="nav-play" onclick="switchPage('play')"><i class="fas fa-gamepad"></i><div class="nav-tooltip">Jugar</div></div>
            <div class="nav-btn" onclick="switchPage('skins')"><i class="fas fa-tshirt"></i><div class="nav-tooltip">Skins</div></div>
            <div class="nav-btn" onclick="switchPage('settings')"><i class="fas fa-cog"></i><div class="nav-tooltip">Ajustes</div></div>
            <div class="user-mini" onclick="showScreen('screen-mode')" title="Volver al menú">
                <img id="dash-head" src="">
                <i class="fas fa-reply"></i>
            </div>
        </div>

        <div class="content-area">
            <div class="title-bar">
                <i class="fas fa-minus win-btn" onclick="ipcRenderer.send('minimizar-app')"></i>
                <i class="fas fa-times win-btn" onclick="ipcRenderer.send('cerrar-app')"></i>
            </div>

            <div id="page-play" class="page-content active">
                <div class="hero-section">
                    <video id="hero-video" class="media-bg" loop muted style="display:none;"></video>
                    <img id="hero-img" class="media-bg" src="">
                    <div class="hero-overlay">
                        <div style="color:var(--accent); font-size:11px; font-weight:800; letter-spacing:2px;">SELECCIONADO</div>
                        <div id="event-title">Cargando...</div>
                        <div class="hero-status"><div class="status-dot" id="srv-dot"></div><span id="srv-text">...</span></div>
                    </div>
                </div>

                <div class="bottom-bar">
                    <div class="version-selector">
                        <div style="flex-grow:1;">
                            <span style="font-size:11px; color:#888; font-weight:bold;">PERFIL</span>
                            <select id="main-selector"><option>Cargando...</option></select>
                        </div>
                        <button class="action-btn" id="btn-create" title="Nueva Instancia" style="display:none; color:var(--custom-blue); border-color:var(--custom-blue);" onclick="openCreateModal()"><i class="fas fa-plus"></i></button>
                    </div>
                    
                    <button class="action-btn" id="btn-folder" title="Carpeta"><i class="fas fa-folder-open"></i></button>
                    <button class="action-btn" id="btn-delete" title="Borrar" style="display:none; color:#ff4444;"><i class="fas fa-trash"></i></button>
                    <button id="btn-main">JUGAR</button>
                </div>
                
                <div style="margin-top:10px;">
                    <div class="progress-bar"><div id="p-fill" class="progress-fill"></div></div>
                    <div id="status-text" style="text-align:center; font-size:10px; color:#666; margin-top:5px; font-family:monospace;">Listo</div>
                </div>
            </div>

            <div id="page-skins" class="page-content">
                <h1>Vestidor</h1>
                <div class="skin-container">
                    <div class="skin-preview-box"><canvas id="skin-canvas" width="200" height="300"></canvas></div>
                    <div class="skin-actions">
                        <div class="model-selector">
                            <div class="model-opt selected" id="model-classic" onclick="setModel('classic')">Steve</div>
                            <div class="model-opt" id="model-slim" onclick="setModel('slim')">Alex</div>
                        </div>
                        
                        <button class="action-btn" style="width:100%; font-size:14px; margin-bottom:15px;" onclick="document.getElementById('skin-upload').click()">Subir y Guardar</button>
                        <input type="file" id="skin-upload" accept="image/png" style="display:none;">
                        
                        <span style="font-size:12px; color:#888; font-weight:bold;">MIS SKINS GUARDADAS</span>
                        <div id="skin-library"></div>
                    </div>
                </div>
            </div>

            <div id="page-settings" class="page-content">
                <h1>Ajustes</h1>
                <div class="setting-group">
                    <span style="font-weight:600;">RAM</span> <span style="color:var(--accent);" id="ram-val">4</span> GB
                    <input type="range" id="ram-slider" min="2" max="16" step="1" value="4">
                </div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer, shell } = require('electron');

        // --- 1. INICIALIZACIÓN ---
        let skinViewer = null;
        
        // Configuración inicial al cargar la ventana
        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar RAM
            const ramSlider = document.getElementById('ram-slider');
            const ramLabel = document.getElementById('ram-val');
            const savedRam = localStorage.getItem('migajasRam') || "4";
            
            if(ramSlider) {
                ramSlider.value = savedRam;
                ramLabel.innerText = savedRam;
                ramSlider.addEventListener('input', (e) => {
                    const val = e.target.value;
                    ramLabel.innerText = val;
                    localStorage.setItem('migajasRam', val);
                });
            }

            // Inicializar Visor 3D
            try {
                const canvas = document.getElementById("skin-canvas");
                skinViewer = new skinview3d.SkinViewer({
                    canvas: canvas, width: 250, height: 350,
                    skin: "https://minotar.net/skin/steve", zoom: 0.8
                });
                skinViewer.animation = new skinview3d.RotatingAnimation();
                skinViewer.autoRotate = true;
            } catch(e) { console.error("Error 3D:", e); }

            // Cargar skins guardadas
            renderSkinLibrary();
        });

        // VARIABLES GLOBALES
        let currentMode='', credenciales=null, eventos=[], vanillaVersions=[], customInstances=[], selectedConfig=null;
        let skinModel = 'default'; 
        let currentSkinData = "https://minotar.net/skin/steve"; 
        const savedSkins = JSON.parse(localStorage.getItem('mySkins') || "[]");

        // --- GESTOR DE SKINS PRO (FIX FOTOS NEGRAS) ---
        
        // 1. Selector Modelo
        window.setModel = (m) => {
            const libModel = (m === 'classic') ? 'default' : 'slim';
            skinModel = libModel;
            document.getElementById('model-classic').classList.toggle('selected', m == 'classic');
            document.getElementById('model-slim').classList.toggle('selected', m == 'slim');
            if(skinViewer && currentSkinData) skinViewer.loadSkin(currentSkinData, { model: libModel });
        };

        // 2. Aplicar Skin (Click en la lista)
        async function applySkin(skinData) {
            // Detectar si es formato nuevo (objeto con foto) o viejo (texto)
            const texture = (typeof skinData === 'object') ? skinData.texture : skinData;
            currentSkinData = texture;
            if(skinViewer) { await skinViewer.loadSkin(texture, { model: skinModel }); }

            if(credenciales && !credenciales.meta) {
                const res = await ipcRenderer.invoke('cambiar-skin', { token: credenciales.access_token, imageBuffer: texture, modelo: skinModel });
                if(res.success) alert("¡Skin actualizada en Minecraft.net!"); else alert("Error subiendo: " + res.error);
            } else { 
                const head = document.getElementById('dash-head');
                if(head) head.src = (typeof skinData === 'object') ? skinData.preview : texture; 
            }
        }

        // 3. Subir y Guardar (FIX FOTOS)
        document.getElementById('skin-upload').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(event) {
                const textureBase64 = event.target.result;
                currentSkinData = textureBase64;
                if(skinViewer) {
                    // Detener animación para foto
                    skinViewer.animation = null;
                    skinViewer.autoRotate = false;
                    await skinViewer.loadSkin(textureBase64, { model: skinModel });
                    
                    // Esperar renderizado
                    setTimeout(() => {
                        try {
                            skinViewer.render();
                            const snapshot = skinViewer.canvas.toDataURL("image/png");
                            
                            if(snapshot.length > 1000) {
                                const newSkinObj = { texture: textureBase64, preview: snapshot };
                                const exists = savedSkins.some(s => (typeof s === 'object' ? s.texture === textureBase64 : s === textureBase64));
                                if(!exists) {
                                    savedSkins.push(newSkinObj);
                                    localStorage.setItem('mySkins', JSON.stringify(savedSkins));
                                    renderSkinLibrary();
                                }
                            } else { alert("Error al generar vista previa."); }
                        } catch(err) {} finally {
                            skinViewer.animation = new skinview3d.RotatingAnimation();
                            skinViewer.autoRotate = true;
                        }
                    }, 600);
                }
            };
            reader.readAsDataURL(file);
            e.target.value = ''; 
        };

        // 4. Renderizar Biblioteca
        function renderSkinLibrary() {
            const lib = document.getElementById('skin-library');
            lib.innerHTML = "";
            if(savedSkins.length === 0) {
                lib.innerHTML = "<div style='color:#666;font-size:10px;grid-column:span 3;text-align:center;padding:20px;'>Sube una skin para guardarla.</div>";
                return;
            }
            savedSkins.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "saved-skin";
                let imgSrc = (typeof item === 'object') ? item.preview : item;
                div.innerHTML = `<img src="${imgSrc}"><div class="del-skin" onclick="deleteSkin(${idx}, event)"><i class="fas fa-trash"></i></div>`;
                div.onclick = () => applySkin(item);
                lib.appendChild(div);
            });
        }

        window.deleteSkin = (idx, e) => {
            e.stopPropagation(); 
            if(confirm("¿Eliminar esta skin de la lista?")) { 
                savedSkins.splice(idx, 1); 
                localStorage.setItem('mySkins', JSON.stringify(savedSkins)); 
                renderSkinLibrary(); 
            }
        };

        // --- NAVIGATION & LOGIN ---
        function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>{s.style.display='none';s.classList.remove('active');}); const s=document.getElementById(id); s.style.display='flex'; setTimeout(()=>s.classList.add('active'),10); }
        function switchPage(p){ document.querySelectorAll('.page-content').forEach(e=>e.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); if(p=='play') document.getElementById('nav-play').classList.add('active'); }

        function toggleOffline(){const f=document.getElementById('offline-form');f.style.display=f.style.display=='block'?'none':'block';}
        async function loginMicrosoft(){ document.getElementById('login-status').innerText="Conectando..."; try{ const r=await ipcRenderer.invoke('login-microsoft'); if(r.success) setCreds(r.profile); }catch{document.getElementById('login-status').innerText="Error";} }
        function loginOffline(){ const n=document.getElementById('nick-input').value.trim(); if(n.length<3)return alert("Corto"); setCreds({name:n,uuid:"off-"+n,meta:{type:'offline'}}); }
        function setCreds(p){
            credenciales=p;
            let face = `https://minotar.net/avatar/${p.name}/64.png`;
            if(p.id) face = `https://crafatar.com/avatars/${p.id.replace(/-/g,'')}?overlay`;
            document.getElementById('dash-head').src = face;
            const skin = p.id ? `https://crafatar.com/skins/${p.id.replace(/-/g,'')}` : `https://minotar.net/skin/${p.name}`;
            currentSkinData = skin;
            if(skinViewer) skinViewer.loadSkin(skin, {model: skinModel});
            showScreen('screen-mode');
        }
        function logout(){credenciales=null;showScreen('screen-login');}

        // --- MODES & LOGIC ---
        async function selectMode(mode){
            currentMode=mode; showScreen('screen-dashboard'); switchPage('play');
            const sel = document.getElementById('main-selector');
            sel.innerHTML="<option>Cargando...</option>";
            ui_reset();

            if(mode==='event'){
                setTheme('#FFA500'); setBtn('btn-accent', "JUGAR EVENTO");
                document.getElementById('btn-create').style.display='none';
                try{
                    const r=await fetch("https://gist.githubusercontent.com/Dexi-lov/8f8babdea6a5bccfe2c2d8a4fe4d8849/raw/evento_migajas.json?"+Date.now());
                    eventos=await r.json(); if(!Array.isArray(eventos))eventos=[eventos];
                    sel.innerHTML="";
                    eventos.forEach((ev,i)=>{const o=document.createElement('option');o.value=i;o.innerText=ev.nombre_evento;sel.appendChild(o);});
                    updateDash(0);
                }catch{sel.innerHTML="<option>Error</option>";}
            }else if(mode==='vanilla'){
                setTheme('#3c8527'); setBtn('btn-green', "JUGAR VANILLA");
                document.getElementById('btn-create').style.display='none';
                ui_bg("minecraft.jpg");
                try{
                    const r=await fetch("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json");
                    const d=await r.json();
                    vanillaVersions=d.versions.filter(v=>v.type==='release');
                    sel.innerHTML="";
                    vanillaVersions.slice(0,30).forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.innerText=v.id;sel.appendChild(o);});
                    updateDash(0);
                }catch{sel.innerHTML="<option>Error</option>";}
            }else if(mode==='custom'){
                setTheme('#2979FF'); setBtn('btn-blue', "JUGAR CUSTOM");
                document.getElementById('btn-create').style.display='block'; 
                ui_bg("instancias.png");
                loadCustomInstances();
            }
        }

        function loadCustomInstances() {
            const raw = localStorage.getItem('custom_instances');
            customInstances = raw ? JSON.parse(raw) : [];
            const sel = document.getElementById('main-selector');
            sel.innerHTML = "";
            if(customInstances.length === 0) { sel.innerHTML = "<option>Sin instancias</option>"; selectedConfig = null; document.getElementById('event-title').innerText = "Crea una (+)"; document.getElementById('btn-main').disabled = true; }
            else { customInstances.forEach((ins, i) => { const opt = document.createElement('option'); opt.value = i; opt.innerText = ins.name; sel.appendChild(opt); }); updateDash(0); document.getElementById('btn-main').disabled = false; }
        }

        async function openCreateModal() {
            document.getElementById('create-modal').style.display='flex';
            const verSel = document.getElementById('new-version');
            if(verSel.children.length < 2) { 
                const r = await fetch("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json");
                const d = await r.json();
                verSel.innerHTML="";
                d.versions.filter(v=>v.type==='release').slice(0,20).forEach(v=>{ const o=document.createElement('option');o.value=v.id;o.innerText=v.id;verSel.appendChild(o); });
            }
        }

        function createInstance() {
            const name = document.getElementById('new-name').value.trim();
            const ver = document.getElementById('new-version').value;
            const loader = document.querySelector('input[name="loader"]:checked').value;
            if(!name) return alert("Ponle nombre");
            const newInst = { id: "custom_" + Date.now(), nombre_evento: name, version_mc: ver, tipo_loader: loader, java_version: "17", url_modpack: null };
            customInstances.push(newInst);
            localStorage.setItem('custom_instances', JSON.stringify(customInstances));
            document.getElementById('create-modal').style.display='none';
            loadCustomInstances();
        }

        document.getElementById('main-selector').onchange=(e)=>updateDash(e.target.value);

        function updateDash(i){
            const btnDel = document.getElementById('btn-delete');
            btnDel.style.display = 'none'; btnDel.onclick = null; 

            if(currentMode==='event'){
                if(!eventos[i]) return;
                selectedConfig=eventos[i];
                document.getElementById('event-title').innerText=selectedConfig.nombre_evento;
                if(selectedConfig.video_fondo){ui_video(selectedConfig.video_fondo);}else{ui_bg(selectedConfig.imagen_fondo||"evento.png");}
                ipcRenderer.invoke('check-instancia',selectedConfig.id).then(ex=>{
                    btnDel.style.display = ex ? 'block' : 'none';
                    btnDel.onclick = async () => { if(confirm("¿Borrar?")) { await ipcRenderer.invoke('borrar-instancia', selectedConfig.id); selectMode('event'); } };
                });
            } else if(currentMode==='vanilla'){
                if(!vanillaVersions[i]) return;
                selectedConfig={version:vanillaVersions[i].id, isVanilla:true};
                document.getElementById('event-title').innerText="Versión "+selectedConfig.version;
            } else if(currentMode==='custom' && customInstances.length > 0){
                selectedConfig = customInstances[i];
                document.getElementById('event-title').innerText = selectedConfig.nombre_evento;
                btnDel.style.display = 'block'; 
                btnDel.onclick = async () => {
                    if(confirm("¿Borrar?")) { await ipcRenderer.invoke('borrar-instancia', selectedConfig.id); customInstances.splice(i, 1); localStorage.setItem('custom_instances', JSON.stringify(customInstances)); loadCustomInstances(); }
                }
            }
        }

        function ui_reset(){ document.getElementById('hero-video').style.display='none'; document.getElementById('hero-video').pause(); document.getElementById('hero-img').style.display='block'; document.getElementById('srv-text').innerText="..."; }
        function ui_bg(src){ document.getElementById('hero-img').src=src; }
        function ui_video(src){ const v=document.getElementById('hero-video'); const i=document.getElementById('hero-img'); i.style.display='none'; v.style.display='block'; v.src=src; v.play(); }
        function setTheme(c){ document.documentElement.style.setProperty('--accent', c); }
        function setBtn(cls, txt){ const b=document.getElementById('btn-main'); b.className=cls; b.innerText=txt; }

        // --- LAUNCH ---
        document.getElementById('btn-main').onclick=()=>{
            const btn = document.getElementById('btn-main');
            btn.disabled=true; btn.innerText="LANZANDO...";
            
            const ramSlider = document.getElementById('ram-slider');
            const ramVal = ramSlider ? ramSlider.value : "4";
            
            const esVanillaReal = (currentMode === 'vanilla');
            ipcRenderer.send('lanzar-juego',{auth:credenciales,ram:ramVal+"G",config:selectedConfig,esVanilla:esVanillaReal});
        };

        ipcRenderer.on('error-lanzamiento', (event, data) => {
            alert(`❌ ${data.titulo}\n\n${data.mensaje}`);
            document.getElementById('btn-main').disabled = false; document.getElementById('btn-main').innerText = "JUGAR";
        });

        ipcRenderer.on('progreso', (event, p) => {
            if (p.total > 0) {
                const porcentaje = (p.task / p.total) * 100;
                document.getElementById('p-fill').style.width = porcentaje + "%";
                let texto = "Cargando...";
                if (p.type === 'download') texto = `Descargando... ${Math.round(porcentaje)}%`;
                else if (p.type === 'assets') texto = `Verificando Recursos... ${Math.round(porcentaje)}%`;
                else if (p.type === 'natives') texto = `Descomprimiendo Nativas... ${Math.round(porcentaje)}%`;
                else texto = `Procesando... ${Math.round(porcentaje)}%`;
                document.getElementById('status-text').innerText = texto;
            }
        });

        ipcRenderer.on('reset-ui', () => { 
            document.getElementById('btn-main').disabled = false; 
            document.getElementById('btn-main').innerText = "JUGAR"; 
            document.getElementById('p-fill').style.width = "0%";
            document.getElementById('status-text').innerText = "Listo";
        });

        document.getElementById('btn-close').onclick=()=>ipcRenderer.send('cerrar-app');
        document.getElementById('btn-min').onclick=()=>ipcRenderer.send('minimizar-app');
        document.getElementById('btn-folder').onclick=()=>ipcRenderer.send('abrir-carpeta',selectedConfig?.isVanilla?'standard':selectedConfig?.id);
    </script>
</body>
</html>
