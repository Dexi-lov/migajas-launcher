name: Preparar versión oficial firmada
on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependencias
        run: npm ci
      - name: Validar versión y preparar novedades
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $tauriVersion) { throw 'Las versiones no coinciden.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          node scripts/release-notes.cjs --github-output
      - name: Compilar y firmar borrador oficial
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: Migajas Launcher ${{ steps.release.outputs.version }} — Nueva era
          releaseBody: ${{ steps.release.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
